<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最大公因數與最小公倍數大冒險棋盤</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e3f2fd;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-container {
            max-width: 800px;
            width: 100%;
            background: white;
            border: 4px solid #00a0e9;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #00a0e9;
            text-align: center;
            text-shadow: 1px 1px 2px #fff;
        }
        
        /* Music Control Styles */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #00a0e9;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 1000;
            transition: all 0.3s;
        }
        .music-control:hover {
            background: #0087c4;
            transform: scale(1.1);
        }
        
        .music-tooltip {
            position: fixed;
            top: 80px;
            right: 20px;
            background: #333;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
            z-index: 1001;
            max-width: 150px;
            display: none;
        }
        
        /* Login/Registration Styles */
        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .auth-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-weight: bold;
            color: #00a0e9;
            font-size: 1.1rem;
        }
        .form-group input {
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #00a0e9;
            border-radius: 8px;
            font-family: 'Arial', sans-serif;
        }
        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 5px #00a0e9;
            background-color: #f0f8ff;
        }
        .auth-button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .auth-btn {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .auth-btn.primary {
            background: #00a0e9;
            color: white;
        }
        .auth-btn.primary:hover {
            background: #0087c4;
            transform: scale(1.05);
        }
        .auth-btn.secondary {
            background: #fbc02d;
            color: #333;
            border: 2px solid #fbc02d;
        }
        .auth-btn.secondary:hover {
            background: #f9a825;
            border-color: #f9a825;
            transform: scale(1.05);
        }
        .toggle-auth-text {
            text-align: center;
            color: #666;
            font-size: 0.95rem;
        }
        .toggle-auth-text button {
            background: none;
            border: none;
            color: #00a0e9;
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.95rem;
            font-weight: bold;
        }
        .toggle-auth-text button:hover {
            color: #0087c4;
        }
        .error-msg {
            color: #f44336;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            background: #ffebee;
            border-radius: 5px;
            display: none;
        }
        .success-msg {
            color: #4caf50;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 5px;
            display: none;
        }
        .user-info {
            text-align: center;
            padding: 15px;
            background: #fff9c4;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px dashed #fbc02d;
        }
        .user-info .username {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00a0e9;
        }
        .logout-btn {
            padding: 8px 15px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .logout-btn:hover {
            background: #d32f2f;
        }
        
        /* Game Styles */
        .game-area {
            display: none;
        }
        .game-area.active {
            display: block;
        }
        .auth-area {
            display: block;
        }
        .auth-area.hidden {
            display: none;
        }
        
        .scoreboard {
            display: flex;
            justify-content: space-between;
            background: #fff9c4;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 20px;
            border: 2px dashed #fbc02d;
        }
        .stage-title {
            background: #ff5252;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
        }
        .question-box {
            display: none;
        }
        .question-box.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            padding: 15px;
            font-size: 1rem;
            border: 2px solid #00a0e9;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #e3f2fd;
            transform: scale(1.02);
        }
        .feedback {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            min-height: 30px;
        }
        .correct { color: #4caf50; }
        .wrong { color: #f44336; }
        .next-btn {
            display: none;
            margin: 20px auto 0;
            padding: 10px 25px;
            background: #00a0e9;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .next-btn:hover { background: #0087c4; }
        .result-screen {
            display: none;
            text-align: center;
        }
        .result-screen h2 { color: #fbc02d; font-size: 2rem; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<!-- Background Music with multiple sources for better compatibility -->
<audio id="background-music" loop preload="auto" style="display: none;">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>

<!-- Music Control Button -->
<button class="music-control" id="music-btn" onclick="toggleMusic()" title="🔊 點擊開啟/關閉音樂">🔊</button>
<div class="music-tooltip" id="music-tooltip"></div>

<div class="game-container">
    <h1>🐱 多啦A夢 HCF & LCM 大冒險 👑</h1>
    
    <!-- Auth Area -->
    <div class="auth-area" id="auth-area">
        <div class="auth-container">
            <h2 id="auth-title" style="color: #00a0e9;">登錄/註冊</h2>
            <div class="error-msg" id="error-msg"></div>
            <div class="success-msg" id="success-msg"></div>
            
            <!-- Login Form -->
            <div id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-username">用戶名 👤</label>
                    <input type="text" id="login-username" placeholder="請輸入用戶名" required>
                </div>
                <div class="form-group">
                    <label for="login-password">密碼 🔐</label>
                    <input type="password" id="login-password" placeholder="請輸入密碼" required>
                </div>
                <div class="auth-button-group">
                    <button class="auth-btn primary" onclick="handleLogin()">登錄</button>
                </div>
            </div>
            
            <!-- Registration Form -->
            <div id="register-form" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label for="register-username">用戶名 👤</label>
                    <input type="text" id="register-username" placeholder="請輸入用戶名" required>
                </div>
                <div class="form-group">
                    <label for="register-password">密碼 🔐</label>
                    <input type="password" id="register-password" placeholder="請輸入密碼" required>
                </div>
                <div class="form-group">
                    <label for="register-confirm-password">確認密碼 🔐</label>
                    <input type="password" id="register-confirm-password" placeholder="請確認密碼" required>
                </div>
                <div class="auth-button-group">
                    <button class="auth-btn primary" onclick="handleRegister()">註冊</button>
                </div>
            </div>
            
            <!-- Toggle Forms -->
            <div class="toggle-auth-text">
                <div id="login-toggle" style="display: block;">
                    還沒有帳戶？<button onclick="toggleAuthForm()">立即註冊</button>
                </div>
                <div id="register-toggle" style="display: none;">
                    已有帳戶？<button onclick="toggleAuthForm()">立即登錄</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Area -->
    <div class="game-area" id="game-area">
        <div class="user-info">
            <div>歡迎，<span class="username" id="current-username">玩家</span>！</div>
            <button class="logout-btn" onclick="handleLogout()">登出</button>
        </div>
        
        <div class="scoreboard">
            <div>關卡: <span id="current-stage">1</span> / 15</div>
            <div>獲得星星: <span id="star-count">⭐ 0</span></div>
        </div>

        <div id="quiz-area"></div>

        <div class="feedback" id="feedback-msg"></div>
        <button class="next-btn" id="next-button" onclick="nextQuestion()">前進下一關 🚀</button>

        <div class="result-screen" id="result-area">
            <h2>🎉 冒險完成！ 🎉</h2>
            <p style="font-size: 1.5rem;">你總共獲得了 <span id="final-stars" style="color:#fbc02d; font-weight:bold;">0</span> 顆星星！</p>
            <p id="rank-msg" style="font-size: 1.2rem; font-weight:bold; margin: 20px 0;"></p>
            <button class="btn" onclick="location.reload()" style="background:#4caf50; color:white; border:none;">再玩一次 🔄</button>
        </div>
    </div>
</div>

<script>
// ============ Music System ============
let isMusicPlaying = false;
const backgroundMusic = document.getElementById('background-music');
const musicBtn = document.getElementById('music-btn');
const musicTooltip = document.getElementById('music-tooltip');

function showTooltip(message, duration = 2000) {
    musicTooltip.textContent = message;
    musicTooltip.style.display = 'block';
    setTimeout(() => {
        musicTooltip.style.display = 'none';
    }, duration);
}

function toggleMusic() {
    if (isMusicPlaying) {
        // Pause music
        backgroundMusic.pause();
        isMusicPlaying = false;
        musicBtn.textContent = '🔇';
        musicBtn.title = '音樂已關閉';
        localStorage.setItem('musicEnabled', 'false');
        showTooltip('🔇 音樂已關閉');
    } else {
        // Play music
        backgroundMusic.volume = 0.3;
        
        const playPromise = backgroundMusic.play();
        
        if (playPromise !== undefined) {
            playPromise.then(() => {
                isMusicPlaying = true;
                musicBtn.textContent = '🔊';
                musicBtn.title = '音樂已開啟';
                localStorage.setItem('musicEnabled', 'true');
                showTooltip('🔊 音樂已開啟');
            }).catch(err => {
                console.error('音樂播放失敗:', err);
                showTooltip('❌ 無法播放音樂<br>請檢查音量設定', 3000);
            });
        } else {
            // Old browser
            isMusicPlaying = true;
            musicBtn.textContent = '🔊';
            musicBtn.title = '音樂已開啟';
            localStorage.setItem('musicEnabled', 'true');
            showTooltip('🔊 音樂已開啟');
        }
    }
}

function initializeMusic() {
    // Add click event to document to enable autoplay after user interaction
    document.addEventListener('click', function enableAudioContext() {
        if (!isMusicPlaying && localStorage.getItem('musicEnabled') === 'true') {
            backgroundMusic.volume = 0.3;
            backgroundMusic.play().catch(err => console.log('自動播放被阻止'));
            document.removeEventListener('click', enableAudioContext);
        }
    }, { once: true });
    
    // Check if music was previously enabled and user is in game
    const musicEnabled = localStorage.getItem('musicEnabled');
    if (musicEnabled === 'true') {
        // Don't auto-play, wait for user interaction
        showTooltip('💡 點擊🔊按鈕播放音樂', 3000);
    }
}

// ============ Authentication System ============
let users = {};
let currentUser = null;

// Load users from localStorage
function loadUsers() {
    const savedUsers = localStorage.getItem('gameUsers');
    if (savedUsers) {
        users = JSON.parse(savedUsers);
    }
}

// Save users to localStorage
function saveUsers() {
    localStorage.setItem('gameUsers', JSON.stringify(users));
}

// Check if user is already logged in
function checkUserSession() {
    const savedUser = localStorage.getItem('currentUser');
    if (savedUser) {
        currentUser = JSON.parse(savedUser);
        startGame();
    }
}

function toggleAuthForm() {
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const loginToggle = document.getElementById('login-toggle');
    const registerToggle = document.getElementById('register-toggle');
    const authTitle = document.getElementById('auth-title');
    
    if (loginForm.style.display !== 'none') {
        // Show register form
        loginForm.style.display = 'none';
        registerForm.style.display = 'flex';
        loginToggle.style.display = 'none';
        registerToggle.style.display = 'block';
        authTitle.innerText = '創建新帳戶';
    } else {
        // Show login form
        loginForm.style.display = 'flex';
        registerForm.style.display = 'none';
        loginToggle.style.display = 'block';
        registerToggle.style.display = 'none';
        authTitle.innerText = '登錄/註冊';
    }
    clearMessages();
}

function showError(message) {
    const errorMsg = document.getElementById('error-msg');
    errorMsg.innerText = message;
    errorMsg.style.display = 'block';
    setTimeout(() => {
        errorMsg.style.display = 'none';
    }, 5000);
}

function showSuccess(message) {
    const successMsg = document.getElementById('success-msg');
    successMsg.innerText = message;
    successMsg.style.display = 'block';
    setTimeout(() => {
        successMsg.style.display = 'none';
    }, 5000);
}

function clearMessages() {
    document.getElementById('error-msg').style.display = 'none';
    document.getElementById('success-msg').style.display = 'none';
}

function handleLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    
    if (!username || !password) {
        showError('❌ 請輸入用戶名和密碼！');
        return;
    }
    
    if (!users[username]) {
        showError('❌ 用戶不存在，請先註冊！');
        return;
    }
    
    if (users[username].password !== password) {
        showError('❌ 密碼錯誤，請重試！');
        return;
    }
    
    currentUser = { username: username };
    localStorage.setItem('currentUser', JSON.stringify(currentUser));
    showSuccess(`✅ 登錄成功！歡迎回來，${username}！`);
    
    setTimeout(() => {
        startGame();
    }, 1500);
}

function handleRegister() {
    const username = document.getElementById('register-username').value.trim();
    const password = document.getElementById('register-password').value;
    const confirmPassword = document.getElementById('register-confirm-password').value;
    
    if (!username || !password || !confirmPassword) {
        showError('❌ 請填寫所有欄位！');
        return;
    }
    
    if (username.length < 3) {
        showError('❌ 用戶名至少需要 3 個字符！');
        return;
    }
    
    if (password.length < 4) {
        showError('❌ 密碼至少需要 4 個字符！');
        return;
    }
    
    if (password !== confirmPassword) {
        showError('❌ 兩次輸入的密碼不一致！');
        return;
    }
    
    if (users[username]) {
        showError('❌ 用戶名已被使用，請選擇另一個！');
        return;
    }
    
    users[username] = { password: password };
    saveUsers();
    showSuccess(`✅ 註冊成功！帳戶 "${username}" 已創建，請登錄！`);
    
    // Clear form
    document.getElementById('register-username').value = '';
    document.getElementById('register-password').value = '';
    document.getElementById('register-confirm-password').value = '';
    
    setTimeout(() => {
        toggleAuthForm();
    }, 1500);
}

function handleLogout() {
    if (confirm('確定要登出嗎？')) {
        currentUser = null;
        localStorage.removeItem('currentUser');
        location.reload();
    }
}

function startGame() {
    document.getElementById('auth-area').classList.add('hidden');
    document.getElementById('game-area').classList.add('active');
    document.getElementById('current-username').innerText = currentUser.username;
    initializeMusic();
    loadQuestion();
}

// ============ Game System ============
// 題目數據
const questions = [
    { stage: "第一階段：大雄的房間", q: "多啦A夢有 12 個紅豆銅鑼燒和 18 個栗子銅鑼燒。他想把這兩款銅鑼燒平均分給幾位朋友，每人分得的紅豆和栗子銅鑼燒數目都要相同。請問最多可以分給多少位朋友（不包括多啦A夢本身）？", options: ["4 位", "5 位", "6 位", "7 位"], ans: 2, hint: "12 和 18 的最大公因數是 6"},
    { stage: "第一階段：大雄的房間", q: "大雄、靜香和小夫在空地玩竹蜻蜓。大雄的竹蜻蜓每 4 分鐘需要降落充電，靜香的每 6 分鐘需要降落充電。如果他們同時開始，最少要多少分鐘後，他們的竹蜻蜓會同時需要充電？", options: ["10 分鐘", "12 分鐘", "14 分鐘", "24 分鐘"], ans: 1, hint: "4 和 6 的最小公倍數是 12"},
    { stage: "第一階段：大雄的房間", q: "大雄有兩塊長度分別是 20 厘米和 30 厘米的記憶麵包。他想把它們切成長度相同的最長長條，而且沒有剩餘。每條長條最長應該是多少厘米？", options: ["5 厘米", "10 厘米", "15 厘米", "20 厘米"], ans: 1, hint: "20 和 30 的最大公因數是 10"},
    { stage: "第一階段：大雄的房間", q: "隨意門的故障密碼是一個兩位數。這個數同時是 6 和 9 的倍數，而且它是符合這個條件中最小的一個。請問這個密碼是多少？", options: ["18", "36", "54", "63"], ans: 0, hint: "6 和 9 的最小公倍數是 18"},
    { stage: "第一階段：大雄的房間", q: "時光機內有兩個互相咬合的齒輪。大齒輪有 24 個齒，小齒輪有 16 個齒。當這兩個齒輪轉到原來出發點的位置時，大齒輪轉了幾圈？", options: ["2 圈", "3 圈", "4 圈", "6 圈"], ans: 1, hint: "24 和 16 的最小公倍數是 48。大齒輪需要轉 48 ÷ 24 = 2 圈"},
    { stage: "第二階段：學校與空地", q: "胖虎想把 24 張藍色門票和 36 張紅色門票包裝成幸運福袋。每個福袋裏的藍色和紅色門票數目都要相同。請問胖虎最多能包裝多少個福袋？", options: ["6 個", "10 個", "12 個", "18 個"], ans: 2, hint: "24 和 36 的最大公因數是 12"},
    { stage: "第二階段：學校與空地", q: "小夫有兩種長度的賽道模型，分別長 15 厘米和 25 厘米。如果他想用這兩種模型各自排成兩條長度相同且最短的直線，這條直線最短應該是多少厘米？", options: ["75 厘米", "100 厘米", "150 厘米", "200 厘米"], ans: 0, hint: "15 和 25 的最小公倍數是 75"},
    { stage: "第二階段：學校與空地", q: "靜香每 8 天去上一次小提琴課，大雄每 12 天去一次同一個中心的功課輔導班。今天她們在中心相遇了，請問最少要多少天後，她們會在中心再次相遇？", options: ["20 天", "24 天", "32 天", "48 天"], ans: 1, hint: "8 和 12 的最小公倍數是 24"},
    { stage: "第二階段：學校與空地", q: "四年級班主任張老師想用一些長 8 厘米、寬 6 厘米的長方形多啦A夢貼紙，拼出一個正方形。請問這個正方形的邊長最短應該是多少厘米？", options: ["24 厘米", "48 厘米", "72 厘米", "96 厘米"], ans: 0, hint: "8 和 6 的最小公倍數是 24"},
    { stage: "第二階段：學校與空地", q: "大雄有一袋鉛筆。無論是每 5 支分給一組，還是每 7 支分給一組，都剛好分完。這袋鉛筆的數量在 60 至 80 支之間。請問這袋鉛筆有多少支？", options: ["60 支", "65 支", "70 支", "75 支"], ans: 2, hint: "5 和 7 的最小公倍數是 35，35 × 2 = 70"},

let currentIdx = 0;
let stars = 0;
let hasAnswered = false;

// 網頁版語音合成（代替音效檔，方便直接開啟）
const synth = window.speechSynthesis;
function playSound(text) {
    if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK';
        utterance.rate = 1.2;
        synth.speak(utterance);
    }
}

function loadQuestion() {
    hasAnswered = false;
    document.getElementById('next-button').style.display = 'none';
    document.getElementById('feedback-msg').innerHTML = '';
    
    if (currentIdx >= questions.length) {
        showResults();
        return;
    }

    document.getElementById('current-stage').innerText = currentIdx + 1;
    const qData = questions[currentIdx];
    
    let html = `
        <div class="question-box active">
            <div class="stage-title">📍 ${qData.stage}</div>
            <p style="font-size:1.15rem; line-height:1.6;"><strong>Q${currentIdx+1}. ${qData.q}</strong></p>
            <div class="options">
    `;
    
    qData.options.forEach((opt, idx) => {
        html += `<button class="btn opt-btn" onclick="checkAnswer(${idx})">${opt}</button>`;
    });
    
    html += `</div></div>`;
    document.getElementById('quiz-area').innerHTML = html;
}

function checkAnswer(selectedIdx) {
    if (hasAnswered) return;
    hasAnswered = true;
    
    const qData = questions[currentIdx];
    const feedback = document.getElementById('feedback-msg');
    const buttons = document.querySelectorAll('.opt-btn');
    
    // 禁用所有按鈕
    buttons.forEach(btn => btn.style.cursor = 'default');

    if (selectedIdx === qData.ans) {
        stars++;
        document.getElementById('star-count').innerText = `⭐ ${stars}`;
        feedback.innerHTML = `<span class="correct">🎵 叮鈴！ 答對了！獲得 ⭐ 寶星一顆！</span>`;
        buttons[selectedIdx].style.background = '#c8e6c9';
        buttons[selectedIdx].style.borderColor = '#4caf50';
        playSound("叮鈴！答對了！");
    } else {
        feedback.innerHTML = `<span class="wrong">🔊 咚波～ 答錯了！<br><small style="color:#666">提示：${qData.hint}</small></span>`;
        buttons[selectedIdx].style.background = '#ffcdd2';
        buttons[selectedIdx].style.borderColor = '#f44336';
        buttons[qData.ans].style.background = '#c8e6c9'; // 顯示正解
        playSound("咚波！大雄跌倒了");
    }
    
    document.getElementById('next-button').style.display = 'block';
}

function nextQuestion() {
    currentIdx++;
    loadQuestion();
}

function showResults() {
    document.getElementById('quiz-area').style.display = 'none';
    document.getElementById('feedback-msg').style.display = 'none';
    document.getElementById('next-button').style.display = 'none';
    
    const resultArea = document.getElementById('result-area');
    resultArea.style.display = 'block';
    document.getElementById('final-stars').innerText = stars;
    
    const rankMsg = document.getElementById('rank-msg');
    if (stars >= 13) {
        rankMsg.innerText = "🏆 【天才出木杉！】大雄的功課成功拿 A+，多啦A夢請你吃特大銅鑼燒！";
        playSound("太厲害了！你是天才出木杉");
    } else if (stars >= 9) {
        rankMsg.innerText = "🥈 【聰明靜香！】表現很好，大雄的功課安全過關！";
        playSound("做得好！跟靜香一樣聰明");
    } else {
        rankMsg.innerText = "🥉 【大雄啊～快用記憶麵包！】別擔心，找多啦A夢一起溫習因數和倍數，下次一定能過關！";
        playSound("大雄啊，快用記憶麵包吧");
    }
}

// Initialize
loadUsers();
checkUserSession();
</script>
