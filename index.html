<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最大公因數與最小公倍數大冒險棋盤</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e3f2fd;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-container {
            max-width: 800px;
            width: 100%;
            background: white;
            border: 4px solid #00a0e9;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #00a0e9;
            text-align: center;
            text-shadow: 1px 1px 2px #fff;
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            background: #fff9c4;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 20px;
            border: 2px dashed #fbc02d;
        }
        .stage-title {
            background: #ff5252;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
        }
        .question-box {
            display: none;
        }
        .question-box.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            padding: 15px;
            font-size: 1rem;
            border: 2px solid #00a0e9;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #e3f2fd;
            transform: scale(1.02);
        }
        .feedback {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            min-height: 30px;
        }
        .correct { color: #4caf50; }
        .wrong { color: #f44336; }
        .next-btn {
            display: none;
            margin: 20px auto 0;
            padding: 10px 25px;
            background: #00a0e9;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .next-btn:hover { background: #0087c4; }
        .result-screen {
            display: none;
            text-align: center;
        }
        .result-screen h2 { color: #fbc02d; font-size: 2rem; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🐱 多啦A夢 HCF & LCM 大冒險 👑</h1>
    
    <div class="scoreboard">
        <div>關卡: <span id="current-stage">1</span> / 15</div>
        <div>獲得星星: <span id="star-count">⭐ 0</span></div>
    </div>

    <div id="quiz-area">
        </div>

    <div class="feedback" id="feedback-msg"></div>
    <button class="next-btn" id="next-button" onclick="nextQuestion()">前進下一關 🚀</button>

    <div class="result-screen" id="result-area">
        <h2>🎉 冒險完成！ 🎉</h2>
        <p style="font-size: 1.5rem;">你總共獲得了 <span id="final-stars" style="color:#fbc02d; font-weight:bold;">0</span> 顆星星！</p>
        <p id="rank-msg" style="font-size: 1.2rem; font-weight:bold; margin: 20px 0;"></p>
        <button class="btn" onclick="location.reload()" style="background:#4caf50; color:white; border:none;">再玩一次 🔄</button>
    </div>
</div>

<script>
// 題目數據
const questions = [
    { stage: "第一階段：大雄的房間", q: "多啦A夢有 12 個紅豆銅鑼燒和 18 個栗子銅鑼燒。他想把這兩款銅鑼燒平均分給幾位朋友，每人分得的紅豆和栗子銅鑼燒數目要相同，且剛好分完。請問最多可以分給多少位朋友？", options: ["2 位", "3 位", "6 位", "36 位"], ans: 2, hint: "求 12 和 18 的最大公因數 (HCF)。" },
    { stage: "第一階段：大雄的房間", q: "大雄、靜香和小夫在空地玩竹蜻蜓。大雄的竹蜻蜓每 4 分鐘需要降落充電，靜香的每 6 分鐘需要降落充電。如果她們同時起飛，最少要過多少分鐘她們才會第一次同時降落充電？", options: ["2 分鐘", "12 分鐘", "24 分鐘", "48 分鐘"], ans: 1, hint: "求 4 和 6 的最小公倍數 (LCM)。" },
    { stage: "第一階段：大雄的房間", q: "大雄有兩塊長度分別是 20 厘米和 30 厘米的記憶麵包。他想把它們切成長度相同的最長長條，而且沒有剩餘。每條記憶麵包應該長多少厘米？", options: ["5 厘米", "10 厘米", "60 厘米", "100 厘米"], ans: 1, hint: "求 20 和 30 的最大公因數 (HCF)。" },
    { stage: "第一階段：大雄的房間", q: "隨意門的故障密碼是一個兩位數。這個數同時是 6 和 9 的倍數，而且它是符合這個條件中最小的一個。請問這個密碼是多少？", options: ["3", "18", "36", "54"], ans: 1, hint: "求 6 和 9 的最小公倍數 (LCM)。" },
    { stage: "第一階段：大雄的房間", q: "時光機內有兩個互相咬合的齒輪。大齒輪有 24 個齒，小齒輪有 16 個齒。當這兩個齒輪轉到原來出發點的位置時，最少要轉動多少個齒？", options: ["8 個", "48 個", "96 個", "384 個"], ans: 1, hint: "求 24 和 16 的最小公倍數 (LCM)。" },
    { stage: "第二階段：學校與空地", q: "胖虎想把 24 張藍色門票和 36 張紅色門票包裝成幸運福袋。每個福袋裏的藍色和紅色門票數目都要相同。請問胖虎最多可以包裝成多少個福袋？", options: ["6 個", "12 個", "24 個", "72 個"], ans: 1, hint: "求 24 和 36 的最大公因數 (HCF)。" },
    { stage: "第二階段：學校與空地", q: "小夫有兩種長度的賽道模型，分別長 15 厘米和 25 厘米。如果他想用這兩種模型各自排成兩條長度相同且最短的直路線，這條路線的長度是多少厘米？", options: ["5 厘米", "50 厘米", "75 厘米", "150 厘米"], ans: 2, hint: "求 15 和 25 的最小公倍數 (LCM)。" },
    { stage: "第二階段：學校與空地", q: "靜香每 8 天去上一次小提琴課，大雄每 12 天去一次同一個中心的功課輔導班。今天她們在中心相遇了，請問最少要過多少天她們才會再次在中心相遇？", options: ["4 天", "24 天", "48 天", "96 天"], ans: 1, hint: "求 8 和 12 的最小公倍數 (LCM)。" },
    { stage: "第二階段：學校與空地", q: "四年級班主任張老師想用一些長 8 厘米、寬 6 厘米的長方形多啦A夢貼紙，拼出一個正方形。請問這個正方形的邊長最少是多少厘米？", options: ["2 厘米", "14 厘米", "24 厘米", "48 厘米"], ans: 2, hint: "求 8 和 6 的最小公倍數 (LCM)。" },
    { stage: "第二階段：學校與空地", q: "大雄有一袋鉛筆。無論是每 5 支分給一組，還是每 7 支分給一組，都剛好分完。這袋鉛筆的數量在 60 至 80 支之間。請問這袋鉛筆有多少支？", options: ["35 支", "65 支", "70 支", "75 支"], ans: 2, hint: "先求 5 和 7 的 LCM 是 35，再找出 60-80 之間的倍數。" },
    { stage: "第三階段：後山與恐龍世界", q: "多啦美帶了 45 顆士多啤梨糖和 60 顆朱古力糖到後山野餐。她想平均分給同行的小朋友（包括自己），每人分得的糖果數目一樣。請問最多可以有多少人一起分享？", options: ["5 人", "15 人", "30 人", "180 人"], ans: 1, hint: "求 45 和 60 的最大公因數 (HCF)。" },
    { stage: "第三階段：後山與恐野世界", q: "神成先生想在長 32 米、寬 24 米的長方形花園四周種植盆栽。四個角落必須種植，且每兩盆盆栽之間的距離要相等且最遠。請問相鄰兩盆盆栽的距離是多少米？", options: ["4 米", "8 米", "12 米", "96 米"], ans: 1, hint: "求 32 和 24 的最大公因數 (HCF)。" },
    { stage: "第三階段：後山與恐龍世界", q: "在恐龍世界裏，縮小電筒每 18 分鐘會發出一次嗶嗶聲，翻譯蒟蒻每 30 分鐘會發出一次嗶嗶聲。如果兩個道具在上午 9:00 同時發出聲音，下一次同時發出聲音會是甚麼時間？", options: ["上午 9:06", "上午 10:30", "上午 11:30", "下午 12:00"], ans: 1, hint: "先求 18 和 30 的 LCM 是 90 分鐘（1小時30分），再加到 9:00 上。" },
    { stage: "第三階段：後山與恐龍世界", q: "胖虎每 14 天去空地打一次棒球，小夫每 21 天去一次。如果他們今天一起在空地練習，下一次一起練習會是在多少個星期後？", options: ["6 個星期", "7 個星期", "42 個星期", "3 個星期"], ans: 0, hint: "先求 14 和 21 的 LCM 是 42 天，再換算成星期（除以 7）。" },
    { stage: "第三階段：後山與恐龍世界", q: "多啦A夢將法寶分類，第一類有 48 件，第二類有 72 件。他想把這些法寶裝進一些大箱子裏，每個箱子裝的法寶數量要相同，且同一箱只能裝同一類的法寶。每個箱子最多可以裝多少件法寶？", options: ["12 件", "24 件", "48 件", "144 件"], ans: 1, hint: "求 48 和 72 的最大公因數 (HCF)。" }
];

let currentIdx = 0;
let stars = 0;
let hasAnswered = false;

// 網頁版語音合成（代替音效檔，方便直接開啟）
const synth = window.speechSynthesis;
function playSound(text) {
    if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK';
        utterance.rate = 1.2;
        synth.speak(utterance);
    }
}

function loadQuestion() {
    hasAnswered = false;
    document.getElementById('next-button').style.display = 'none';
    document.getElementById('feedback-msg').innerHTML = '';
    
    if (currentIdx >= questions.length) {
        showResults();
        return;
    }

    document.getElementById('current-stage').innerText = currentIdx + 1;
    const qData = questions[currentIdx];
    
    let html = `
        <div class="question-box active">
            <div class="stage-title">📍 ${qData.stage}</div>
            <p style="font-size:1.15rem; line-height:1.6;"><strong>Q${currentIdx+1}. ${qData.q}</strong></p>
            <div class="options">
    `;
    
    qData.options.forEach((opt, idx) => {
        html += `<button class="btn opt-btn" onclick="checkAnswer(${idx})">${opt}</button>`;
    });
    
    html += `</div></div>`;
    document.getElementById('quiz-area').innerHTML = html;
}

function checkAnswer(selectedIdx) {
    if (hasAnswered) return;
    hasAnswered = true;
    
    const qData = questions[currentIdx];
    const feedback = document.getElementById('feedback-msg');
    const buttons = document.querySelectorAll('.opt-btn');
    
    // 禁用所有按鈕
    buttons.forEach(btn => btn.style.cursor = 'default');

    if (selectedIdx === qData.ans) {
        stars++;
        document.getElementById('star-count').innerText = `⭐ ${stars}`;
        feedback.innerHTML = `<span class="correct">🎵 叮鈴！ 答對了！獲得 ⭐ 寶星一顆！</span>`;
        buttons[selectedIdx].style.background = '#c8e6c9';
        buttons[selectedIdx].style.borderColor = '#4caf50';
        playSound("叮鈴！答對了！");
    } else {
        feedback.innerHTML = `<span class="wrong">🔊 咚波～ 答錯了！<br><small style="color:#666">提示：${qData.hint}</small></span>`;
        buttons[selectedIdx].style.background = '#ffcdd2';
        buttons[selectedIdx].style.borderColor = '#f44336';
        buttons[qData.ans].style.background = '#c8e6c9'; // 顯示正解
        playSound("咚波！大雄跌倒了");
    }
    
    document.getElementById('next-button').style.display = 'block';
}

function nextQuestion() {
    currentIdx++;
    loadQuestion();
}

function showResults() {
    document.getElementById('quiz-area').style.display = 'none';
    document.getElementById('feedback-msg').style.display = 'none';
    document.getElementById('next-button').style.display = 'none';
    
    const resultArea = document.getElementById('result-area');
    resultArea.style.display = 'block';
    document.getElementById('final-stars').innerText = stars;
    
    const rankMsg = document.getElementById('rank-msg');
    if (stars >= 13) {
        rankMsg.innerText = "🏆 【天才出木杉！】大雄的功課成功拿 A+，多啦A夢請你吃特大銅鑼燒！";
        playSound("太厲害了！你是天才出木杉");
    } else if (stars >= 9) {
        rankMsg.innerText = "🥈 【聰明靜香！】表現很好，大雄的功課安全過關！";
        playSound("做得好！跟靜香一樣聰明");
    } else {
        rankMsg.innerText = "🥉 【大雄啊～快用記憶麵包！】別擔心，找多啦A夢一起溫習因數和倍數，下次一定能過關！";
        playSound("大雄啊，快用記憶麵包吧");
    }
}

// 初始化第一題
loadQuestion();
</script>

</body>
</html>
